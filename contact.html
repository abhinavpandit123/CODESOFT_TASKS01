<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Abhinav Kumar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="design.css">
    <style>
        .contact-container {
            background-color: #05080d;
            min-height: 100vh;
            padding: 60px 20px;
        }

        .contact-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 60px;
            animation: slideDown 0.8s ease-out;
        }

        .contact-header h1 {
            color: #f4f7fb;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        .contact-header h1 span {
            color: rgb(218, 21, 21);
        }

        .contact-header p {
            color: #c5d0da;
            font-size: 1.1em;
        }

        .contact-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 50px;
        }

        .contact-form-section, .contact-info-section {
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #8feaff;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background-color: #080d14;
            border: 2px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            color: #f4f7fb;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(193, 208, 218, 0.5);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #00d2ff;
            background-color: rgba(0, 210, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2), inset 0 0 15px rgba(0, 210, 255, 0.05);
            transform: translateY(-2px);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgb(218, 21, 21), rgb(255, 50, 50));
            color: #f4f7fb;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(218, 21, 21, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(218, 21, 21, 0.5);
            background: linear-gradient(135deg, rgb(255, 50, 50), rgb(218, 21, 21));
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .contact-info {
            background-color: #080d14;
            padding: 30px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.1);
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            padding: 15px;
            border-radius: 8px;
        }

        .info-item:hover {
            background-color: rgba(0, 210, 255, 0.08);
            transform: translateX(5px);
        }

        .info-item i {
            color: #00d2ff;
            font-size: 1.5em;
            margin-right: 20px;
            min-width: 30px;
            text-align: center;
        }

        .info-text h3 {
            color: #8feaff;
            margin-bottom: 5px;
        }

        .info-text p {
            color: #c5d0da;
            line-height: 1.6;
        }

        .info-text a {
            color: #00d2ff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .info-text a:hover {
            color: rgb(218, 21, 21);
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(0, 210, 255, 0.2);
        }

        .social-links a {
            width: 45px;
            height: 45px;
            background-color: rgba(0, 210, 255, 0.1);
            border: 2px solid #00d2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8feaff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-links a:hover {
            background-color: #00d2ff;
            color: #05080d;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.4);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .contact-content {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .contact-header h1 {
                font-size: 2em;
            }

            .contact-form-section, .contact-info-section {
                animation: fadeInUp 0.8s ease-out both;
            }
        }
    </style>
</head>
<body class="portfolio-home">
<div class="containeer">
    <h2><span>ABHINAV</span> KUMAR </h2>
    <div class="navbar" id="navbar">
        <a href="port.html#home"><i class="fa-solid fa-house"></i> Home</a>
        <a href="port.html#skills"><i class="fa-solid fa-code"></i> Skill</a>
        <a href="port.html#projects"><i class="fa-solid fa-briefcase"></i> Project</a>
        <a href="port.html#resume"><i class="fa-solid fa-file"></i> Resume</a>
        <a href="port.html#about"><i class="fa-solid fa-user"></i> About</a>
        <a href="port.html#contact"><i class="fa-solid fa-envelope"></i> Contact</a>
    </div>
    <div class="menu" id="menu">
        <i class="fa-solid fa-bars"></i>
    </div>
</div>

<div class="contact-container">
    <div class="contact-wrapper">
        <div class="contact-header">
            <h1>Get In <span>Touch</span></h1>
            <p>I'd love to hear from you. Let's connect and create something amazing together!</p>
        </div>

        <div class="contact-content">
            <div class="contact-form-section">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name"><i class="fa-solid fa-user"></i> Your Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="phone"><i class="fa-solid fa-phone"></i> Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+91 (123) 456-7890">
                    </div>

                    <div class="form-group">
                        <label for="subject"><i class="fa-solid fa-heading"></i> Subject</label>
                        <input type="text" id="subject" name="subject" placeholder="What's this about?" required>
                    </div>

                    <div class="form-group">
                        <label for="message"><i class="fa-solid fa-message"></i> Message</label>
                        <textarea id="message" name="message" placeholder="Tell me more about your project..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fa-solid fa-paper-plane"></i> Send Message
                    </button>
                </form>
            </div>

            <div class="contact-info-section">
                <div class="contact-info">
                    <div class="info-item">
                        <i class="fa-solid fa-map-marker-alt"></i>
                        <div class="info-text">
                            <h3>Location</h3>
                            <p>India</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-phone"></i>
                        <div class="info-text">
                            <h3>Phone</h3>
                            <p><a href="tel:+919905401694">+91 9905401694</a></p>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-envelope"></i>
                        <div class="info-text">
                            <h3>Email</h3>
                            <p><a href="mailto:abhinavkumar0122@gmail.com">abhinavkumar0122@gmail.com</a></p>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-solid fa-clock"></i>
                        <div class="info-text">
                            <h3>Response Time</h3>
                            <p>Within 24 hours</p>
                        </div>
                    </div>

                    <div class="social-links">
                        <a href="https://www.linkedin.com/in/abhinav-kumar-mca" target="_blank" title="LinkedIn">
                            <i class="fa-brands fa-linkedin"></i>
                        </a>
                        <a href="https://www.github.com/abhinavpandit123" target="_blank" title="GitHub">
                            <i class="fa-brands fa-github"></i>
                        </a>
                        <a href="https://twitter.com" target="_blank" title="Twitter">
                            <i class="fa-brands fa-twitter"></i>
                        </a>
                        <a href="https://instagram.com" target="_blank" title="Instagram">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const contactForm = document.getElementById('contactForm');
    
    if (contactForm) {
        contactForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
            
            // Create mailto link with pre-filled subject
            const mailtoLink = `mailto:abhinavkumar0122@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\n${message}`)}`;
            
            window.location.href = mailtoLink;
            
            // Reset form
            contactForm.reset();
        });
    }

    // Smooth scroll behavior
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
                target.scrollIntoView({ behavior: 'smooth' });
            }
        });
    });
</script>
</body>
</html>
